\<!DOCTYPE html>

\<html lang="id">
\<head>

\<title>Komunitas WhatsApp CPNS RI\</title>

\<meta name="theme-color" content="#075E54">
\<meta name="description" content="Terhubung dengan komunitas grup WhatsApp CPNS RI.">

\<style>
\* {
&#x20;   box-sizing: border-box;
&#x20;   margin: 0;
&#x20;   padding: 0;
}

body {
&#x20;   font-family: Arial, Helvetica, sans-serif;
&#x20;   min-height: 100vh;
&#x20;   min-height: 100dvh;
&#x20;   background: #f0f4f3;
&#x20;   display: flex;
&#x20;   justify-content: center;
&#x20;   align-items: center;
&#x20;   padding: 22px;
&#x20;   color: #1d2926;
}

.container {
&#x20;   width: 100%;
&#x20;   max-width: 460px;
}

.card {
&#x20;   background: #ffffff;
&#x20;   border-radius: 24px;
&#x20;   padding: 38px 28px;
&#x20;   text-align: center;
&#x20;   box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
&#x20;   border: 1px solid #e9efed;
}

/\* LOGO \*/

.logo {
&#x20;   width: 82px;
&#x20;   height: 82px;
&#x20;   background: #e5f8ee;
&#x20;   border-radius: 25px;
&#x20;   display: flex;
&#x20;   justify-content: center;
&#x20;   align-items: center;
&#x20;   margin: 0 auto 25px;
}

.logo svg {
&#x20;   width: 47px;
&#x20;   height: 47px;
}

/\* JUDUL \*/

h1 {
&#x20;   font-size: 25px;
&#x20;   line-height: 1.35;
&#x20;   font-weight: 750;
&#x20;   color: #123d34;
&#x20;   margin-bottom: 12px;
}

.subtitle {
&#x20;   font-size: 15px;
&#x20;   line-height: 1.7;
&#x20;   color: #77847f;
&#x20;   margin-bottom: 30px;
}

/\* STATUS \*/

.status-box {
&#x20;   background: #f5f9f7;
&#x20;   border: 1px solid #e6efeb;
&#x20;   border-radius: 16px;
&#x20;   padding: 22px 16px;
&#x20;   margin-bottom: 22px;
}

.status-label {
&#x20;   font-size: 12px;
&#x20;   color: #84928c;
&#x20;   text-transform: uppercase;
&#x20;   letter-spacing: 1.2px;
&#x20;   font-weight: bold;
&#x20;   margin-bottom: 10px;
}

\#status {
&#x20;   font-size: 15px;
&#x20;   line-height: 1.6;
&#x20;   color: #344b43;
}

\#status b {
&#x20;   color: #087d50;
&#x20;   font-size: 17px;
&#x20;   display: inline-block;
&#x20;   margin-top: 5px;
}

/\* LOADER \*/

.loader {
&#x20;   width: 48px;
&#x20;   height: 48px;
&#x20;   border: 5px solid #e4eee9;
&#x20;   border-top-color: #20bd70;
&#x20;   border-radius: 50%;
&#x20;   animation: spin 0.85s linear infinite;
&#x20;   margin: 22px auto 5px;
}

@keyframes spin {
&#x20;   to {
&#x20;       transform: rotate(360deg);
&#x20;   }
}

/\* FOOTER \*/

.footer {
&#x20;   font-size: 12px;
&#x20;   color: #a0aaa5;
&#x20;   line-height: 1.6;
&#x20;   margin-top: 24px;
}

.footer span {
&#x20;   color: #168b59;
&#x20;   font-weight: bold;
}

/\* ERROR \*/

.error {
&#x20;   color: #c0392b !important;
}

.error + .loader {
&#x20;   display: none;
}

/\* MOBILE \*/

@media (max-width: 480px) {

&#x20;   body {
&#x20;       padding: 18px;
&#x20;   }

&#x20;   .card {
&#x20;       padding: 35px 22px;
&#x20;       border-radius: 22px;
&#x20;   }

&#x20;   .logo {
&#x20;       width: 76px;
&#x20;       height: 76px;
&#x20;       border-radius: 23px;
&#x20;   }

&#x20;   h1 {
&#x20;       font-size: 24px;
&#x20;   }

&#x20;   .subtitle {
&#x20;       font-size: 14px;
&#x20;   }

&#x20;   .status-box {
&#x20;       padding: 22px 14px;
&#x20;   }

&#x20;   \#status {
&#x20;       font-size: 15px;
&#x20;   }

&#x20;   \#status b {
&#x20;       font-size: 17px;
&#x20;   }
}

\</style>

\</head>

\</div>

\<script>  const API = "[https://script.google.com/macros/s/AKfycbyCtuNe9dAEajYUAjd5r28j5PUWOssDwBWIlkdkAVEpKHBTiC5ytCJw3PxANNxUGzZ8cg/exec](https://script.google.com/macros/s/AKfycbyCtuNe9dAEajYUAjd5r28j5PUWOssDwBWIlkdkAVEpKHBTiC5ytCJw3PxANNxUGzZ8cg/exec)";  const statusElement = document.getElementById("status"); const loader = document.getElementById("loader");  fetch(API) .then(res => {      if (!res.ok) {         throw new Error("Server tidak merespons.");     }      return res.json();  }) .then(data => {      if (data.success && data.url) {          statusElement.innerHTML =             "Menghubungkan ke:\<br>\<b>\</b>";          statusElement.querySelector("b").textContent = data.nama;          setTimeout(function() {              window\.location.href = data.url;          }, 1500);      } else {          statusElement.textContent =             data.message || "Belum ada grup yang tersedia.";          statusElement.classList.add("error");          loader.style.display = "none";      }  }) .catch(() => {      statusElement.textContent =         "Tidak dapat terhubung ke server. Silakan coba beberapa saat lagi.";      statusElement.classList.add("error");      loader.style.display = "none";  });  \</script>
