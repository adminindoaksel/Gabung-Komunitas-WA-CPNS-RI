<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabung Komunitas WhatsApp CPNS Republik Indonesia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 14px 40px;
            background: #f7f9fc;
            color: #263238;
            font-family: Comfortaa, Arial, sans-serif;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .card {
            background: #fff;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            margin-top: 30px;
        }

        /* JUDUL */

        .success-title {
            color: #287bce;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            line-height: 1.5;
            margin: 0 0 16px;
            margin-top: 12px;
        }

        .title-divider {
            width: 70px;
            height: 3px;
            background: #8ec5f5;
            border-radius: 10px;
            margin: 0 auto 22px;
        }

        /* KOTAK INFORMASI */

        .info-box {
            background: #f0f7ff;
            border: 1px solid #d8eaff;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 0;
        }

        .info-box p {
            color: #40566d;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
            margin: 0;
        }

        /* STATUS */

        #status {
            color: #40566d;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
            margin: 0;
            margin-bottom: 6px;
        }

        /* LOADER */

        .loader {
            width: 32px;
            height: 32px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #25a85a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 8px auto 12px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* TOMBOL WHATSAPP */

        .whatsapp-button {
            display: none;
            width: 100%;
            padding: 13px 20px;
            background: #287bce;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: not-allowed;
            opacity: 1;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* UCAPAN WHATSAPP */

        .whatsapp-invitation {
            text-align: center;
            margin-bottom: 0;
        }

        .whatsapp-icon {
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto 5px;
            border-radius: 50%;
            background: #e8f7ef;
            color: #25a85a;
        }

        .whatsapp-icon svg {
            width: 27px;
            height: 27px;
        }

        .whatsapp-invitation p {
            color: #40566d;
            font-size: 13px;
            line-height: 1.7;
            margin: 0;
        }

        /* FOOTER */

        .footer {
            color: #263238;
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            font-weight: 400;
        }

        /* TAMPILAN HP */

        @media (max-width: 760px) {

            body {
                padding: 16px 10px 15px;
            }

            .container {
                max-width: 100%;
            }

            .card {
                padding: 20px 16px;
                margin-top: 30px;
            }

            .success-title {
                font-size: 21px;
            }

        }

    </style>
</head>

<body>

    <main class="container">

        <div class="card">

            <!-- JUDUL -->

            <h1 class="success-title">
                SELAMAT BERGABUNG DI KOMUNITAS WHATSAPP CPNS REPUBLIK INDONESIA
            </h1>

            <!-- GARIS PEMISAH -->

            <div class="title-divider"></div>

            <!-- INFORMASI GRUP -->

            <div class="info-box">

                <p id="status">
                    Sedang menghubungkan ke Grup WhatsApp...
                </p>

                <div class="loader" id="loader"></div>

                <!-- TOMBOL BERGABUNG -->

                <button id="whatsappButton" class="whatsapp-button" type="button" disabled>
                    <span>Mohon Tunggu...</span>
                    <span class="loading-spinner"></span>
                </button>

            </div>

            <!-- UCAPAN WHATSAPP -->

            <div class="whatsapp-invitation">

                <div class="whatsapp-icon">

                    <svg viewBox="0 0 24 24" aria-hidden="true">

                        <path fill="currentColor" d="M12.04 2C6.58 2 2.14 6.44 2.14 11.9c0 1.75.46 3.46 1.33 4.97L2.05 22l5.26-1.38a9.9 9.9 0 0 0 4.73 1.2h.01c5.46 0 9.9-4.44 9.9-9.9A9.9 9.9 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.17-1.14l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 1 1 6.97 3.85zm4.5-6.14c-.25-.13-1.48-.73-1.71-.81-.23-.08-.4-.13-.57.13-.17.25-.65.81-.8.98-.15.17-.3.19-.55.06-.25-.13-1.06-.39-2.02-1.24-.75-.67-1.25-1.5-1.4-1.75-.15-.25-.02-.39.11-.52.12-.12.25-.3.38-.44.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.57-1.37-.78-1.88-.2-.5-.41-.43-.57-.44h-.49c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1s.9 2.44 1.03 2.61c.13.17 1.77 2.7 4.29 3.78.6.26 1.07.42 1.44.54.6.19 1.15.16 1.58.1.48-.07 1.48-.61 1.69-1.2.21-.59.21-1.1.15-1.2-.06-.1-.23-.17-.48-.29z"/>

                    </svg>

                </div>
                
            </div>

            <!-- FOOTER -->

            <div class="footer">
                &copy; CPNS Republik Indonesia
            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        // API GOOGLE APPS SCRIPT KOMUNITAS CPNS RI

        const API_URL = "https://script.google.com/macros/s/AKfycbyCtuNe9dAEajYUAjd5r28j5PUWOssDwBWIlkdkAVEpKHBTiC5ytCJw3PxANNxUGzZ8cg/exec";


        async function mulaiRedirect() {

            const status = document.getElementById("status");

            const loader = document.getElementById("loader");

            const whatsappButton = document.getElementById("whatsappButton");

            whatsappButton.style.display = "flex";
            whatsappButton.disabled = true;


            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Server tidak merespons dengan baik.");
                }

                const data = await response.json();


                if (data.success && data.url) {

                    // Tampilkan nama grup yang tersedia

                    status.textContent = "Grup tersedia: " + data.nama;

                    // Sembunyikan loader

                    loader.style.display = "none";

                    // Tombol tetap pasif selama proses pengalihan

                    whatsappButton.style.display = "flex";
                    whatsappButton.disabled = true;

                    // Alihkan otomatis setelah 2 detik

                    setTimeout(() => {

                        window.location.href = data.url;

                    }, 2000);


                } else {

                    // Jika seluruh grup penuh

                    status.textContent = data.message || "Seluruh grup sedang penuh.";

                    loader.style.display = "none";

                    whatsappButton.style.display = "none";

                }


            } catch (error) {

                // Jika terjadi kendala koneksi

                status.textContent =
                    "Terjadi kendala saat menghubungkan ke server. Silakan coba kembali.";

                loader.style.display = "none";

                whatsappButton.style.display = "none";

                console.error("Kesalahan:", error);

            }

        }


        // Jalankan alokasi grup otomatis

        mulaiRedirect();

    </script>

</body>
</html>
